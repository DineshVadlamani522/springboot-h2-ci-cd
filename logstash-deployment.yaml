apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:8.5.1
          ports:
            - containerPort: 5044
---
apiVersion: v1
kind: Service
metadata:
  name: logstash-service
  namespace: logging
spec:
  selector:
    app: logstash
  type: NodePort
  ports:
    - protocol: TCP
      port: 5044
      targetPort: 5044
      nodePort: 31003