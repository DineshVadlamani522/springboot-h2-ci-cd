apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
        - name: logstash
          image: logstash:7.17.3
          ports:
            - containerPort: 5044
            - containerPort: 9600
---
apiVersion: v1
kind: Service
metadata:
  name: logstash-service
  namespace: logging
spec:
  selector:
    app: logstash
  type: NodePort
  ports:
    - protocol: TCP
      port: 5044
      targetPort: 5044
      nodePort: 7003  # Assigned custom port
    - protocol: TCP
      port: 9600
      targetPort: 9600
      nodePort: 7005  # Additional port for monitoring Logstash